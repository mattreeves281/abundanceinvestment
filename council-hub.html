<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Council Hub - Council Investment Platform</title>
    <link rel="stylesheet" href="/incoming/abundance.css">
    <link rel="stylesheet" href="/incoming/ai-kit-original.css">
    <link rel="stylesheet" href="/incoming/pages/council-hub.css">
</head>
<body>
    <div hidden>
        <div data-ai-council-reference></div>
        <div data-ai-no-open-header></div>
        <div data-ai-no-open-words></div>
        <div data-ai-no-open-button-text></div>
        <div data-ai-no-open-button-url></div>
        <div data-ai-no-past-invest-header></div>
        <div data-ai-no-past-invest-copy></div>
        <div data-ai-no-past-invest-button-url></div>
        <div data-ai-no-past-invest-button-text></div>
        <div data-ai-no-chart-img-url></div>
        <div data-ai-no-chart-img-alt></div>
        <div data-ai-no-chart-img-caption></div>
    </div>

    <section class="position-relative bg-colour--primary-surface p-t-spacer-4xl type-white ai-hero">
        <div class="container">
            <div class="row brand-media-box align-items-start">
                <div class="col-12 col-md-8">
                    <h1 class="text-choke-md--640 text-center--md font-secondary"></h1>
                    <p class="body--xl text-choke-md--640 text-center--md m-b-spacer-sm"></p>
                </div>
                <div class="col-12 col-md-4">
                    <div class="ai-heroLogoRail">
                        <img class="image-responsive hero-header__illustration brand-media-box__img" alt="" loading="eager" fetchpriority="high" />
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="bg-colour--primary-surface bg-mask bg-mask--b-convex m-b-spacer-2xl ai-hero-mask"></div>

    <section class="m-b-spacer-md">
        <div class="container text-choke-960">
            <div class="row">
                <div class="col-12 text-center" id="council-intro"></div>
            </div>
        </div>
    </section>

    <div id="ai-scope-wrap" hidden>
        <div class="bg-colour--primary-surface bg-mask bg-mask--t-convex ai-no-open-mask ai-scope"></div>

        <section class="home-green-investing position-relative p-y-spacer-xs bg-colour--primary-surface ai-no-open ai-scope">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="flex-center">
                            <h2 class="text-center m-b-spacer-sm"></h2>
                        </div>
                        <div class="flex-center">
                            <p class="body--lg text-center choke-800 m-b-spacer-sm"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="bg-colour--primary-surface bg-mask bg-mask--b-convex ai-no-open-mask ai-scope"></div>
        <div class="bg-colour--primary-surface bg-mask bg-mask--t-convex ai-open-bg ai-scope"></div>

        <section class="home-green-investing position-relative p-y-spacer-xs ai-open-bg ai-scope">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="flex-center">
                            <h2 class="text-center m-b-spacer-sm">Current Investment Opportunities</h2>
                        </div>
                        <div class="flex-center">
                            <div class="ai-custom ai-open-investments">
                                <div id="ai-open-councils"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="bg-colour--primary-surface bg-mask bg-mask--b-convex ai-open-bg ai-scope"></div>

        <section class="home-financial m-y-spacer-md p-y-spacer-xl mx-auto choke-800 ai-scope">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="flex-center">
                            <h2 class="text-center">Use of Funds</h2>
                        </div>
                        <div class="flex-center">
                            <p class="body--lg text-center choke-800 m-b-spacer-lg">
                                <span></span>
                            </p>
                        </div>
                        <div class="flex-center ai-uof-wrap">
                            <div id="ai-use-of-funds"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="bg-colour--primary-surface bg-mask bg-mask--t-convex ai-scope"></div>

        <section class="home-green-investing position-relative p-y-spacer-xs bg-colour--primary-surface ai-past-wrap ai-scope">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div id="ai-past-investments"></div>
                    </div>
                </div>
            </div>
        </section>

        <div class="bg-colour--primary-surface bg-mask bg-mask--b-convex ai-scope"></div>

        <section class="home-financial m-y-spacer-md p-y-spacer-xl mx-auto choke-800 ai-scope">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="flex-center">
                            <h2 class="text-center">Financial Performance</h2>
                        </div>
                        <div class="flex-center">
                            <p class="body--lg text-center choke-800 m-b-spacer-lg">
                                <span></span>
                            </p>
                        </div>
                        <div class="flex flex-center">
                            <figure class="brand-figure w-100">
                                <img width="800" height="450" alt="" loading="lazy">
                                <figcaption></figcaption>
                            </figure>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script type="module" src="/incoming/pages/council-hub.js"></script>
</body>
</html>
