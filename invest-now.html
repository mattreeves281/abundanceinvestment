<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invest Now - Council Investment Platform</title>
    <link rel="stylesheet" href="/incoming/abundance.css">
    <link rel="stylesheet" href="/incoming/ai-kit-original.css">
    <link rel="stylesheet" href="/incoming/pages/invest-now.css">
</head>
<body>
    <div class="bg-colour--primary-surface bg-mask bg-mask--t-convex"></div>
    <section class="home-green-investing position-relative p-y-spacer-xs bg-colour--primary-surface">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="flex-center">
                        <h2 class="text-center m-b-spacer-sm">
                            Start Investing Today
                        </h2>
                    </div>
                    <div class="flex-center">
                        <p class="body--lg text-center choke-800 m-b-spacer-sm">
                            Join thousands of investors supporting sustainable projects
                        </p>
                    </div>
                    <div class="flex-center">
                        <p class="body--lg text-center choke-800 m-b-spacer-sm">
                            <div class="flex-start flex-center--md">
                                <div class="flex-column m-r-spacer-md">
                                    <p class="body--lg text-choke-md--640 text-center--md m-b-spacer-2xs">Spent on projects so far</p>
                                    <p class="heading-4 text-choke-md--640 text-center--md m-b-spacer-2xs font-secondary"
                                       data-ai-stat="spentOnProjects">--</p>
                                </div>
                                <div class="flex-column m-r-spacer-md">
                                    <p class="body--lg text-choke-md--640 text-center--md m-b-spacer-2xs">Projects financed</p>
                                    <p class="heading-4 text-choke-md--640 text-center--md m-b-spacer-2xs font-secondary"
                                       data-ai-stat="projectsFinanced">--</p>
                                </div>
                            </div>
                        </p>
                    </div>
                </div>
                <p class="body--md text-center m-t-spacer-md">
                    <a href="/browse-councils.html" class="brand-btn-grey--bordered brand-btn-grey--bordered--bordered btn btn--lg btn--icon">
                        Learn more
                    </a>
                </p>
            </div>
        </div>
    </section>
    <div class="bg-colour--primary-surface bg-mask bg-mask--b-convex"></div>

    <script type="module" src="/incoming/pages/invest-now.js"></script>
</body>
</html>
