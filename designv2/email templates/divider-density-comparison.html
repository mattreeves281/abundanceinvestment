<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abundance Divider Density Comparison</title>
  <style>
    body { margin:0; background:#faf8f8; color:#363635; font-family:Arial,sans-serif; }
    main { max-width:720px; margin:0 auto; padding:28px 16px 48px; }
    h1 { margin:0 0 10px; font:700 32px/36px Georgia,serif; letter-spacing:-0.02em; }
    h2 { margin:34px 0 12px; font:700 22px/26px Georgia,serif; letter-spacing:-0.02em; }
    p { margin:0 0 18px; font-size:15px; line-height:23px; }
    .set { background:#fff; border:1px solid #e5e1e0; border-radius:20px; overflow:hidden; box-shadow:0 10px 30px rgba(54,54,53,0.05); }
    .row { padding:16px 0 20px; border-top:1px solid #e5e1e0; }
    .row:first-child { border-top:0; }
    .label { padding:0 18px 8px; font-size:13px; line-height:18px; font-weight:700; color:#4d4a46; }
    img { display:block; width:100%; max-width:640px; height:auto; margin:0 auto; border:0; }
  </style>
</head>
<body>
  <main>
    <h1>Divider Density Comparison</h1>
    <p>Each asset is displayed at 640px wide. The source PNGs are 2x, 4x and 6x.</p>

    <h2>Thin Divider</h2>
    <section class="set">
      <div class="row"><div class="label">2x, 1280 x 147</div><img src="cdn-upload-assets/divider-rise-left-yellow-to-white@2x.png" alt=""></div>
      <div class="row"><div class="label">4x, 2560 x 294</div><img src="cdn-upload-assets-4x/divider-rise-left-yellow-to-white@4x.png" alt=""></div>
      <div class="row"><div class="label">6x, 3840 x 441</div><img src="cdn-upload-assets-6x/divider-rise-left-yellow-to-white@6x.png" alt=""></div>
    </section>

    <h2>Section Mask</h2>
    <section class="set">
      <div class="row"><div class="label">2x, 1280 x 147</div><img src="cdn-upload-assets/mask-top-white-to-pink@2x.png" alt=""></div>
      <div class="row"><div class="label">4x, 2560 x 294</div><img src="cdn-upload-assets-4x/mask-top-white-to-pink@4x.png" alt=""></div>
      <div class="row"><div class="label">6x, 3840 x 441</div><img src="cdn-upload-assets-6x/mask-top-white-to-pink@6x.png" alt=""></div>
    </section>

    <h2>Footer Peak</h2>
    <section class="set">
      <div class="row"><div class="label">2x, 1280 x 147</div><img src="cdn-upload-assets/footer-peak-white-to-yellow@2x.png" alt=""></div>
      <div class="row"><div class="label">4x, 2560 x 294</div><img src="cdn-upload-assets-4x/footer-peak-white-to-yellow@4x.png" alt=""></div>
      <div class="row"><div class="label">6x, 3840 x 441</div><img src="cdn-upload-assets-6x/footer-peak-white-to-yellow@6x.png" alt=""></div>
    </section>
  </main>
</body>
</html>
