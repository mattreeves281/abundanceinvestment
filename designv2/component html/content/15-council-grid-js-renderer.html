<script>
(function () {
  const grid = document.getElementById('abv2-council-grid');
  if (!grid) return;

  const endpoint = grid.dataset.endpoint;

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatShortMoney(value) {
    const number = Number(value);

    if (!Number.isFinite(number) || number <= 0) return null;

    if (number >= 1000000) {
      const millions = number / 1000000;
      return `£${millions % 1 === 0 ? millions.toFixed(0) : millions.toFixed(1)}m`;
    }

    if (number >= 1000) {
      const thousands = number / 1000;
      return `£${thousands % 1 === 0 ? thousands.toFixed(0) : thousands.toFixed(1)}k`;
    }

    return `£${number.toLocaleString('en-GB')}`;
  }

  function normaliseStatus(status) {
    if (Array.isArray(status)) return status[0] || null;
    return status || null;
  }

  function isVisibleCouncil(record) {
    const fields = record && record.fields ? record.fields : {};
    const status = normaliseStatus(fields.raiseStatus);

    return status !== 'Coming soon';
  }

  function statRow(label, value) {
    if (value === null || value === undefined || value === '') return '';

    if (label === null || label === undefined || label === '') {
      return `
        <p class="abundance-body-compact m-b-spacer-3xs">
          ${escapeHtml(value)}
        </p>
      `;
    }

    return `
      <p
        class="abundance-body-compact m-b-spacer-3xs"
        style="display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:.75rem; align-items:baseline;"
      >
        <span>${escapeHtml(label)}</span>
        <strong style="text-align:right;">${escapeHtml(value)}</strong>
      </p>
    `;
  }

  function councilCard(record) {
    const fields = record.fields || {};

    const name = fields.issuingCouncil || 'Council';
    const url = fields.councilHub || '#';
    const hex = fields.hex || '#363635';
    const logo = fields.whiteLogo || '';

    const raised = formatShortMoney(fields.totalRaised);
    const spent = formatShortMoney(fields.totalSpent);
    const projects = Number(fields.projectsFunded || 0);

    const stats = [
      statRow('Raised', raised),
      projects > 0 ? statRow('Projects financed', projects) : '',
      spent ? statRow('Spent so far', spent) : statRow('', 'No spend reported so far')
    ].filter(Boolean).join('');

    return `
      <div class="col d-flex">
        <a class="si-card si-card--2xs abundance-card--interactive card-with-main-action h-100 w-100 d-flex flex-column text-decoration-none" href="${escapeHtml(url)}" aria-label="View ${escapeHtml(name)}">
          <div
            class="d-flex align-items-center justify-content-center border-radius--lg p-all-spacer-xs"
            style="height:104px; background:${escapeHtml(hex)};"
          >
            ${logo ? `
              <img
                src="${escapeHtml(logo)}"
                alt="${escapeHtml(name)}"
                loading="lazy"
                decoding="async"
                class="img-fluid"
                style="max-height:58px; object-fit:contain;"
              >
            ` : ''}
          </div>

          <div class="p-t-spacer-sm" aria-hidden="true"></div>

          <h3 class="si-heading-5 m-b-spacer-0" style="min-height:2.35em;">
            ${escapeHtml(name)}
          </h3>

          <div class="m-t-spacer-xs" style="min-height:4.8em;">
            ${stats}
          </div>

          <span class="abundance-action-text brand-primary mt-auto p-t-spacer-xs">
            View council
          </span>
        </a>
      </div>
    `;
  }

  function renderEmptyState() {
    grid.innerHTML = `
      <div class="col d-flex">
        <div class="si-card si-card--2xs abundance-card--interactive card-with-main-action h-100 w-100">
          <p class="abundance-body-compact m-b-spacer-0">
            No councils are available at the moment.
          </p>
        </div>
      </div>
    `;
  }

  function renderErrorState() {
    grid.innerHTML = `
      <div class="col d-flex">
        <div class="si-card si-card--2xs abundance-card--interactive card-with-main-action h-100 w-100">
          <p class="abundance-body-compact m-b-spacer-0">
            Sorry, we could not load councils right now.
          </p>
        </div>
      </div>
    `;
  }

  async function init() {
    try {
      if (!endpoint) {
        renderEmptyState();
        return;
      }

      const response = await fetch(endpoint);

      if (!response.ok) {
        throw new Error(`Council endpoint returned ${response.status}`);
      }

      const data = await response.json();

      const records = Array.isArray(data)
        ? data
        : Array.isArray(data.records)
          ? data.records
          : [];

      const councils = records
        .filter(isVisibleCouncil)
        .sort((a, b) => {
          const nameA = a.fields?.issuingCouncil || '';
          const nameB = b.fields?.issuingCouncil || '';
          return nameA.localeCompare(nameB);
        });

      if (!councils.length) {
        renderEmptyState();
        return;
      }

      grid.innerHTML = councils.map(councilCard).join('');
    } catch (error) {
      console.error(error);
      renderErrorState();
    }
  }

  init();
})();
