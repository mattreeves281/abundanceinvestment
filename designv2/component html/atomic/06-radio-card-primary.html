<div class="abundance-radio-card abundance-radio-card--primary">
                  <label class="abundance-radio-card__label" for="investment-type-regular">
                    Automatic regular investing
                  </label>
                  <input
                    class="abundance-radio-card__input"
                    id="investment-type-regular"
                    aria-describedby="investment-type-regular-desc"
                    type="radio"
                    name="investment_type"
                    value="regular"
                    checked
                  >
                  <div id="investment-type-regular-desc" class="abundance-radio-card__content">
                    <hr>
                    <div class="p-t-spacer-2xs" aria-hidden="true"></div>
                    <p>
                      Invest a set amount each month, automatically split equally across all open council investments.
                    </p>
                    <div class="p-t-spacer-3xs" aria-hidden="true"></div>
                    <ul class="body--md m-b-spacer-0">
                      <li>Support councils across the UK</li>
                      <li>Grow your portfolio over time</li>
                      <li>Hands-off, automatic investing</li>
                      <li>Choose to automatically reinvest your returns</li>
                    </ul>
                  </div>
                  <div class="abundance-radio-card__indicator" aria-hidden="true">
                    <div class="abundance-radio-card__indicator--unselected">
                      <div class="abundance-blob abundance-blob--light-grey abundance-blob--sm"></div>
                    </div>
                    <div class="abundance-radio-card__indicator--selected">
                      <div class="abundance-blob abundance-blob--pink abundance-blob--sm">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="abundance-radio-card__tick">
                          <path fill="#fff" d="M9.55 15.35 5.8 11.6l-1.4 1.4 5.15 5.15L20.1 7.6l-1.4-1.4-9.15 9.15Z"></path>
                        </svg>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
