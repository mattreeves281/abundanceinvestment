<div class="abundance-radio-card abundance-radio-card--secondary">
                  <label class="abundance-radio-card__label" for="investment-type-choose">
                    Choose your own investments
                  </label>
                  <input
                    class="abundance-radio-card__input"
                    id="investment-type-choose"
                    aria-describedby="investment-type-choose-desc"
                    type="radio"
                    name="investment_type"
                    value="choose"
                  >
                  <div id="investment-type-choose-desc" class="abundance-radio-card__content">
                    <hr>
                    <div class="p-t-spacer-2xs" aria-hidden="true"></div>
                    <p>
                      Pick and choose how much to invest in each of the open council investments.
                    </p>
                    <div class="p-t-spacer-3xs" aria-hidden="true"></div>
                    <ul class="body--md m-b-spacer-0">
                      <li>Make a one-off investment today</li>
                      <li>Control which councils you support</li>
                      <li>Invest in all, or just some</li>
                      <li>Returns go back into your portfolio to withdraw or reinvest yourself</li>
                    </ul>
                  </div>
                  <div class="abundance-radio-card__indicator" aria-hidden="true">
                    <div class="abundance-radio-card__indicator--unselected">
                      <div class="abundance-blob abundance-blob--light-grey abundance-blob--sm"></div>
                    </div>
                    <div class="abundance-radio-card__indicator--selected">
                      <div class="abundance-blob abundance-blob--cyan abundance-blob--sm">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="abundance-radio-card__tick">
                          <path fill="#fff" d="M9.55 15.35 5.8 11.6l-1.4 1.4 5.15 5.15L20.1 7.6l-1.4-1.4-9.15 9.15Z"></path>
                        </svg>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
